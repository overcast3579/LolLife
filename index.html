<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070a0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LoLLife - 英雄聯盟職業選手人生模擬器">
  <title>LoLLife - 英雄聯盟職業選手人生模擬器</title>
  <meta name="description" content="從 16 歲台灣天梯路人到世界冠軍與名人堂，一場種子化的英雄聯盟職業選手生涯模擬。BP選角、旅外、國際賽、傷病、轉會、退役——每一個決定都算數。">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- ==================== 開場建立選手畫面 ==================== -->
  <div id="start">
    <div class="wrap">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 32px;">🎮</span>
        <span style="font-size: 11px; letter-spacing: 0.2em; color: var(--dim); font-weight: 700;">ESPORTS CAREER SIMULATOR</span>
      </div>
      
      <h1 id="logo-tap">LoLLife<br><em>英雄聯盟職業選手人生</em></h1>
      <div id="ver-badge" style="position:fixed;top:8px;right:10px;font-size:10px;letter-spacing:1px;color:var(--dim);opacity:.6;font-family:var(--mono);z-index:50;pointer-events:none">v1.0.0</div>
      <p class="sub">16 歲天梯衝分 → 業餘網咖盃 → LCP 職業聯賽 → 旅外 LCK/LPL → MSI・世界大賽 → 傳奇退役。每一顆骰子與決策都算數。</p>

      <div class="field">
        <label>選手真實姓名 / 暱稱</label>
        <input id="in-name" maxlength="12" placeholder="例如：陳小明">
      </div>

      <div class="field">
        <label>比賽遊戲 ID (In-Game ID)</label>
        <input id="in-id" maxlength="14" placeholder="例如：Dreamer">
      </div>

      <div class="field">
        <label>主打位置 (Position)</label>
        <div class="seg" id="seg-pos">
          <button data-v="TOP">上路</button>
          <button data-v="JUG">打野</button>
          <button data-v="MID" class="on">中路</button>
          <button data-v="ADC">下路</button>
          <button data-v="SUP">輔助</button>
        </div>
      </div>

      <button class="btn main" style="margin-top:26px" id="btn-start">開始生涯 ▸ 16歲 天梯衝分</button>

      <!-- 顯示與主題設定 -->
      <details id="fld-display">
        <summary>顯示設定<span class="sum" id="disp-sum"></span></summary>
        <div id="disp-body">
          <div class="field">
            <label>佈景主題</label>
            <div class="seg two" id="seg-theme">
              <button data-t="a" class="on">深藍轉播記分板</button>
              <button data-t="b">電子看板</button>
              <button data-t="c">報紙版面</button>
              <button data-t="d">現代數據庫</button>
            </div>
          </div>
          <div class="field" id="fld-big">
            <label>字級</label>
            <div class="seg two" id="seg-big">
              <button data-b="0" class="on">標準</button>
              <button data-b="1">大字</button>
            </div>
          </div>
          <div class="field" id="fld-ui">
            <label>介面版型</label>
            <div class="seg two" id="seg-ui">
              <button data-u="0" class="on">電腦版 (三欄)</button>
              <button data-u="1">手機版 (單欄)</button>
            </div>
          </div>
        </div>
      </details>

      <p class="seedline">世界種子
        <input id="seed-show" maxlength="24">
        · <a href="#" id="seed-re">換一個</a><br>相同種子＋相同選擇＝相同人生（支援分享種子碼）
      </p>

      <footer style="text-align:center;margin-top:22px;color:var(--dim);font-size:12px">
        LoLLife · 非官方英雄聯盟選手人生模擬器 · 2026
      </footer>
    </div>
  </div>

  <!-- ==================== 遊戲主畫面 (App) ==================== -->
  <div id="app">
    
    <!-- 桌面左側時間軸欄 (>920px) -->
    <aside id="tl-side">
      <div id="tl-in">
        <div class="tl-brand">
          <span style="font-size: 22px;">⚡</span>
          <div><b>LoLLife</b><span class="sub">職業電競生涯</span></div>
        </div>
        <div id="tl-list"></div>
        <div class="tl-seed">SEED <b id="tl-seed"></b><span class="tl-ver" id="tl-ver">v1.0.0</span></div>
      </div>
    </aside>

    <!-- 中間主紀錄流與頂部記分板 -->
    <div id="mid">
      
      <!-- 記分板 HUD (Scoreboard) -->
      <header id="board" style="display:none">
        <div id="bd-top">
          <div id="bd-name"></div>
          <div id="bd-team"></div>
          <button id="btn-schedule-guide" title="年度賽程規劃">📅 賽程規劃</button>
          <button id="btn-menu" title="選單">選單</button>
        </div>

        <div id="bd-grid">
          <div class="bd-cell"><b id="bd-age">16</b><span>年齡</span></div>
          <div class="bd-cell"><b id="bd-year">2026</b><span>年份</span></div>
          <div class="bd-cell"><b id="bd-ovr">50</b><span>綜合 OVR</span></div>
          <div class="bd-cell" id="bd-sal-cell" tabindex="0">
            <b id="bd-sal">0</b>
            <span id="bd-sal-lbl">生涯薪(萬)</span>
          </div>
        </div>

        <div id="lamps">
          <span class="lamp" id="lp0"><i></i>季前特訓</span>
          <span class="lamp" id="lp1"><i></i>賽季中</span>
          <span class="lamp" id="lp2"><i></i>季末轉會</span>
        </div>

        <div id="tl-strip"></div>
      </header>

      <!-- 主紀錄卡片流 (Cards Stream) -->
      <main id="log"></main>
    </div>

    <!-- 右側：特質面板 + 底部操作區 (Action Panel) -->
    <aside id="act-side">
      <div id="act-in">
        <!-- 桌面特質欄 -->
        <div id="trait-side">
          <div class="tt">解鎖特質 (TRAITS)</div>
          <div id="trait-tags"></div>
        </div>

        <!-- 底部動態操作區 -->
        <footer id="act" style="display:none"></footer>
      </div>
    </aside>

  </div>

  <!-- ==================== 對話框 (Modal) ==================== -->
  <div id="modal">
    <div id="modal-box"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
